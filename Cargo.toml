[package]
name = "wadm"
version = "0.98.0"
edition = "2021"
authors = ["angrytisback"]
description = "Modern, ultra-fast and lightweight Linux Web Administration Panel"
repository = "https://github.com/angrytisback/WADM"
homepage = "https://github.com/angrytisback/WADM"
license = "MIT"
readme = "README.md"
keywords = ["linux", "admin", "dashboard", "docker", "sysadmin"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
env_logger = "0.11"
log = "0.4"
actix-files = "0.7.0"
bollard = "0.19.4"
futures-util = "0.3.31"
tokio = { version = "1.48.0", features = ["full"] }
argon2 = "0.5"
totp-rs = { version = "5.6", features = ["qr", "gen_secret"] }
jsonwebtoken = "9.2"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1.19"
base64 = "0.22"
actix-ws = "0.3.0"
portable-pty = "0.9.0"
actix-multipart = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
async-trait = "0.1"
sha2 = "0.10"
rcgen = "0.14.10"
instant-acme = "0.8.5"
rustls-pemfile = "2.2.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "connect"] }
reqwest = { version = "0.13.5", features = ["stream", "json"] }
flate2 = "1.1.10"
tar = "0.4.46"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2.0"
