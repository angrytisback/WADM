name: Bug Report
description: Report a reproducible defect in WADM.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, verify the issue is not already reported and that you are running the latest release.
        For security vulnerabilities, use the private advisory process described in SECURITY.md.

  - type: input
    id: version
    attributes:
      label: WADM Version
      description: Output of `wadm --version` or the release tag from the binary filename.
      placeholder: "v0.96.0"
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: OS and Kernel Version
      description: Output of `uname -r` and the Linux distribution name and version.
      placeholder: "6.8.0-41-generic / Ubuntu 24.04 LTS"
    validations:
      required: true

  - type: input
    id: docker_version
    attributes:
      label: Docker Version (if relevant)
      description: Output of `docker version --format '{{.Server.Version}}'`. Leave blank if not applicable.
      placeholder: "27.1.1"

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide a minimal, ordered sequence of steps that reliably triggers the bug.
      placeholder: |
        1. Navigate to the App Store.
        2. Click Install on the Nextcloud template.
        3. Observe error in the UI notification.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen when following the steps above?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens? Include any visible error messages or UI state.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: |
        Attach relevant log output. Collect with:
        `journalctl -u wadm --since "10 minutes ago" --no-pager`
        or from the WADM Logs panel if the server is running.
      render: shell
